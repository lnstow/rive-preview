<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rive Preview | WebGL2 .riv Inspector</title>
    <meta
      name="description"
      content="Preview local Rive .riv files in a WebGL2 canvas, switch artboards and animations, and inspect state machines, view models, enums, and runtime properties."
    />
    <meta
      name="keywords"
      content="Rive, Rive preview, riv viewer, .riv inspector, WebGL2, animation preview, state machine inspector, view model inspector"
    />
    <meta name="application-name" content="Rive Preview" />
    <meta name="author" content="Rive Preview" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffd928" />
    <link rel="canonical" href="https://rive.aifan.moe/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rive.aifan.moe/" />
    <meta property="og:title" content="Rive Preview | WebGL2 .riv Inspector" />
    <meta
      property="og:description"
      content="Upload or drop a local .riv file, preview it in WebGL2, and inspect artboards, animations, state machines, view models, enums, and runtime properties."
    />
    <meta property="og:site_name" content="Rive Preview" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rive Preview | WebGL2 .riv Inspector" />
    <meta
      name="twitter:description"
      content="A local Rive .riv previewer and property inspector with WebGL2 playback controls."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Rive Preview",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Preview local Rive .riv files in a WebGL2 canvas, switch artboards and animations, and inspect state machines, view models, enums, and runtime properties.",
        "url": "https://rive.aifan.moe/",
        "sameAs": ["https://github.com/lnstow/rive-preview"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-stack">
          <p class="eyebrow">Rive Street Lab</p>
          <h1><span>Rive</span><span>Preview</span></h1>
          <div class="headline-tags" aria-hidden="true">
            <span>WebGL2</span>
            <span>.riv</span>
            <span>Inspect</span>
          </div>
          <span class="upload-arrow" aria-hidden="true">&#10549;</span>
        </div>
        <div class="topbar-actions">
          <a
            class="github-link"
            href="https://github.com/lnstow/rive-preview"
            target="_blank"
            rel="noreferrer"
            title="GitHub"
            aria-label="Open GitHub repository"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
              <path d="M9 18c-4.51 2-5-2-7-2" />
            </svg>
          </a>
          <div id="statusPill" class="status-pill" data-tone="idle">Not loaded</div>
        </div>
      </header>

      <main class="workspace">
        <section class="preview-pane" aria-label="Rive preview">
          <label id="dropzone" class="dropzone" for="fileInput">
            <input id="fileInput" type="file" accept=".riv" />
            <span class="drop-icon" aria-hidden="true">&#8679;</span>
            <span>
              <span class="drop-title">Choose or drop .riv file</span>
              <span id="fileMeta" class="drop-meta">Drag and drop supported</span>
            </span>
          </label>

          <div class="toolbar" aria-label="Preview controls">
            <label class="field">
              <span>Artboard</span>
              <select id="artboardSelect" disabled></select>
            </label>
            <label class="field">
              <span>Playback Source</span>
              <select id="motionSelect" disabled></select>
            </label>
            <label class="field compact">
              <span>Fit</span>
              <select id="fitSelect" disabled>
                <option value="contain">Contain</option>
                <option value="cover">Cover</option>
                <option value="fill">Fill</option>
                <option value="fitWidth">Fit Width</option>
                <option value="fitHeight">Fit Height</option>
                <option value="scaleDown">Scale Down</option>
                <option value="none">None</option>
              </select>
            </label>
            <div class="button-group" aria-label="Playback controls">
              <button id="playButton" class="icon-button" type="button" title="Play" aria-label="Play" disabled>
                <span aria-hidden="true">&#9658;</span>
              </button>
            </div>
          </div>

          <div id="canvasStage" class="canvas-stage">
            <canvas id="riveCanvas" width="1280" height="860"></canvas>
            <div id="artboardFrame" class="artboard-frame" aria-hidden="true" hidden></div>
            <div id="emptyState" class="empty-state">
              <strong>Rive</strong>
              <span>.riv</span>
            </div>
          </div>
        </section>

        <aside class="properties-pane" aria-label="Properties">
          <div class="properties-head">
            <div>
              <p class="eyebrow">Inspect</p>
              <h2>Properties</h2>
            </div>
          </div>
          <div id="propertiesPanel" class="properties-panel">
            <div class="empty-card">
              <strong>Waiting for file</strong>
              <span>Properties will appear here</span>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
